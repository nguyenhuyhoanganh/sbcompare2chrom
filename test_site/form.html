<!doctype html>
<html><head><meta charset="utf-8"><title>Form page</title></head>
<body>
<h1>Form</h1>
<form id="form" method="post" action="/echo">
  <label>Name <input id="name" name="name" type="text"></label>
  <label>Email <input id="email" name="email" type="email"></label>
  <label>Password <input id="password" name="password" type="password"></label>
  <label>Note <textarea id="note" name="note"></textarea></label>
  <label>Color <select id="color" name="color">
    <option value="red">Red</option><option value="green">Green</option><option value="blue">Blue</option>
  </select></label>
  <label><input id="agree" name="agree" type="checkbox" value="yes"> Agree</label>
  <label><input type="radio" name="size" id="size-s" value="s"> S</label>
  <label><input type="radio" name="size" id="size-l" value="l"> L</label>
  <label>File <input id="file" name="file" type="file" multiple></label>
  <button id="submit" type="submit">Submit</button>
</form>
<p id="file-names"></p>
<script>
document.getElementById('file').addEventListener('change', e =>
  document.getElementById('file-names').textContent = Array.from(e.target.files).map(f => f.name).join(','));
</script>
</body></html>

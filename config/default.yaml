# Common settings for every target. Layers, later wins:
#   default.yaml < targets/<target>.yaml < local.yaml (+ its targets.<target> section)
#   < environment variables (SB_*) < CLI flags
# Machine-specific paths go to config/local.yaml (git-ignored), see local.example.yaml.

# samsung = Samsung Internet build under test; chrome = Google Chrome / Chrome for Testing,
# the upstream reference (same Chromium base). Flag: --target, env: SB_TARGET.
target: samsung

browser:
  # Path to SamsungInternet.exe (env: SB_EXE, flag: --exe)
  exe: ""
  # "launch": chromedriver starts the exe (default).
  # "attach": we start the exe with --remote-debugging-port and chromedriver attaches.
  #           Use it when the fork refuses to start under chromedriver.
  mode: launch
  # Explicit chromedriver path (env: SB_DRIVER, flag: --driver). Best option: build
  # the `chromedriver` target from the SAME fork source tree, then the version always matches.
  chromedriver: ""
  # Chromium version the build is based on, e.g. "141.0.7390.37". Empty = auto-detect.
  chromium_version: ""
  headless: false
  window_size: [1400, 900]
  # Extra command line switches for the browser.
  args:
    - --no-first-run
    - --no-default-browser-check
    - --disable-background-networking
    - --disable-component-update
    - --disable-sync
    - --password-store=basic
    - --lang=en-US
  # Removes the "controlled by automated test software" infobar.
  exclude_switches: [enable-automation]
  # Preferences merged into Default/Preferences of every fresh profile.
  prefs:
    intl.accept_languages: en-US,en
    download.prompt_for_download: false
    download.directory_upgrade: true
    safebrowsing.enabled: false
    credentials_enable_service: false
    profile.password_manager_enabled: false
  # function | module | session : how often a fresh browser + profile is created.
  scope: function
  # Keep the profile folder after the test (debugging).
  keep_profile: false

timeouts:
  page_load: 30     # seconds, driver page load timeout
  default: 10       # default explicit wait
  long: 30          # downloads, heavy pages
  poll: 0.2         # poll interval for waits
  native: 10        # pywinauto window/dialog waits

paths:
  artifacts: artifacts        # reports, screenshots, profiles, downloads
  test_site: test_site        # static pages served by the local HTTP server
  test_data: test_data

server:
  host: 127.0.0.1
  port: 0                     # 0 = random free port

# Internal page paths; the scheme (internet:// or chrome://) comes from the target file.
pages:
  bookmarks: bookmarks
  history: history
  downloads: downloads
  settings: settings
  extensions: extensions
  newtab: newtab
  version: version
  flags: flags

# Chrome Web Store (add-on install from the store; needs internet through the proxy)
webstore:
  item_url: "https://chromewebstore.google.com/detail/{id}"
  # visible text of the install / remove button - Samsung may rebrand it
  add_button_texts: ["Add to Chrome", "Add to Samsung Internet", "Add to browser"]
  remove_button_texts: ["Remove from Chrome", "Remove from Samsung Internet", "Remove from browser"]

native:
  # Enable pywinauto based checks (auto-disabled on non-Windows).
  enabled: true
  backend: uia
  # ui_map (logical name -> UIA criteria of the browser's own UI) is set per target.

report:
  screenshot_on_failure: true
  # red outline on the element the failing step was using (visible in page.png)
  highlight_on_failure: true
  dom_on_failure: true
  uia_on_failure: true
  # screenshot after every step(...) block, pass or fail (flag: --screenshot-steps)
  screenshot_steps: false

# Company proxy. The browser uses the Windows system proxy by default; set
# browser_proxy only to force one. driver downloads use HTTPS_PROXY/HTTP_PROXY env vars
# or download_proxy below.
network:
  browser_proxy: ""             # e.g. http://proxy.company.com:8080
  proxy_bypass: "127.0.0.1;localhost;<local>"
  download_proxy: ""            # proxy for chromedriver download; empty = env vars

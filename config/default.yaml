# Settings for testing Samsung Browser / Samsung Internet for Windows. Layers, later wins:
#   default.yaml < local.yaml < environment variables (SB_*) < CLI flags
# Machine-specific paths go to config/local.yaml (git-ignored), see local.example.yaml.

browser:
  # Path to SamsungInternet.exe - set it in config/local.yaml (env: SB_EXE, flag: --exe)
  exe: ""
  # "attach": we start the exe with --remote-debugging-port and chromedriver attaches.
  #           Needed for Samsung Browser: chromedriver hangs when it launches the exe itself.
  # "launch": chromedriver starts the exe.
  mode: attach
  # Explicit chromedriver path (env: SB_DRIVER, flag: --driver). Best option: build
  # the `chromedriver` target from the SAME fork source tree, then the version always matches.
  chromedriver: ""
  # Chromium version the build is based on, e.g. "141.0.7390.37". Empty = auto-detect.
  chromium_version: ""
  headless: false
  window_size: [1400, 900]
  # Extra command line switches for the browser.
  args:
    - --no-first-run
    - --no-default-browser-check
    - --disable-background-networking
    - --disable-component-update
    - --disable-sync
    - --password-store=basic
    - --lang=en-US
  # Removes the "controlled by automated test software" infobar.
  exclude_switches: [enable-automation]
  # Preferences merged into Default/Preferences of every fresh profile.
  prefs:
    intl.accept_languages: en-US,en
    download.prompt_for_download: false
    download.directory_upgrade: true
    safebrowsing.enabled: false
    credentials_enable_service: false
    profile.password_manager_enabled: false
  # function | module | session : how often a fresh browser + profile is created.
  scope: function
  # Keep the profile folder after the test (debugging).
  keep_profile: false

timeouts:
  page_load: 30     # seconds, driver page load timeout
  default: 10       # default explicit wait
  long: 30          # downloads, heavy pages
  poll: 0.2         # poll interval for waits
  native: 10        # pywinauto window/dialog waits

paths:
  artifacts: artifacts            # everything a run or a tool writes (git-ignored)
  results: artifacts/test-results # the latest test run only: emptied when a run starts
  cases: cases                    # test case documents (<feature>/*.md)
  data: resources/data            # <name>.yaml test data (bookmark seeds, add-on ids ...)
  extensions: resources/extensions  # sample add-ons (unpacked folders)
  profiles: resources/profiles    # profile templates for @browser(profile=...)
  site: resources/site            # static pages served by the local HTTP server

server:
  host: 127.0.0.1
  port: 0                     # 0 = random free port

# Internal pages. The address bar SHOWS internet://bookmarks, but WebDriver/CDP navigation
# only accepts chrome://bookmarks (driver.get("internet://...") stays on about:blank).
# Typing internet://... into the omnibox (native.navigate) works too.
pages:
  scheme: chrome
  display_scheme: internet
  bookmarks: bookmarks
  history: history
  downloads: downloads
  settings: settings
  extensions: extensions
  newtab: newtab
  version: version
  flags: flags

# Chrome Web Store (add-on install from the store; needs internet through the proxy)
webstore:
  item_url: "https://chromewebstore.google.com/detail/{id}"
  # visible text of the install / remove button - Samsung may rebrand it
  # (the store shows "Install" on some item pages, "Add to Chrome" on others)
  add_button_texts: ["Add to Chrome", "Install", "Add to Samsung Internet", "Add to browser"]
  remove_button_texts: ["Remove from Chrome", "Uninstall", "Remove from Samsung Internet", "Remove from browser"]

native:
  # Enable pywinauto based checks (auto-disabled on non-Windows).
  enabled: true
  backend: uia
  # Logical name -> UIA criteria of the browser's own UI (toolbar, menus, bubbles, dialogs).
  ui_map: config/native_ui.yaml

report:
  screenshot_on_failure: true
  # red outline on the element the failing step was using (visible in page.png)
  highlight_on_failure: true
  dom_on_failure: true
  # screen.png / result pictures on Windows: window = only the browser's windows (frame,
  # bubbles, menus, its Save As/Open dialogs), other apps and monitors left out;
  # screen = every monitor (to also see File Explorer or Windows notifications)
  screen_capture: window
  uia_on_failure: true
  # a picture before every interaction (target framed in red) + one per step (flag: --screenshot-steps)
  screenshot_steps: false
  # step pictures attached to the Confluence page: failed (failed/error cases only), all, none
  # (a full run with step pictures is ~280 pictures / ~22 MB; flag: --confluence-steps)
  confluence_step_pictures: failed

# Company proxy. The browser uses the Windows system proxy by default; set
# browser_proxy only to force one. driver downloads use HTTPS_PROXY/HTTP_PROXY env vars
# or download_proxy below.
network:
  browser_proxy: ""             # e.g. http://proxy.company.com:8080
  proxy_bypass: "127.0.0.1;localhost;<local>"
  download_proxy: ""            # proxy for chromedriver download; empty = env vars

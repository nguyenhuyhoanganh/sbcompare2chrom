# Native UI of Samsung Browser for Windows. Verified on Samsung Browser 31.0.0.55
# (Chromium 148, arm64). Re-check after UI changes with:  python -m sbtest.tools.uia_dump --out uia.txt
# Keys you can use: title, title_re, control_type, auto_id, class_name, found_index
#
# Differences from Chrome worth knowing:
# - the omnibox is a Group named "Address and search bar, <url>" (no Edit control)
# - Ctrl+D bookmarks at once and shows a "Page bookmarked. [Edit]" toast (no bubble)
# - the star only exists while the page is bookmarked ("Remove from Bookmarks"); it is
#   StarView up to build 31, PageActionView since build 155, where it only shows once the
#   omnibox has lost focus (native.focus_page())
# - app menu button is named "Samsung Browser"; menu items carry the shortcut in their
#   name ("Downloads Ctrl+J"), menus match by prefix so "Downloads" works
# - the address bar shows internet://..., WebDriver/CDP report chrome://...

main_window:
  class_name: Chrome_WidgetWin_1

omnibox:
  class_name: OmniboxViewViews

back_button:
  control_type: Button
  title_re: "(?i)^back$"
forward_button:
  control_type: Button
  title_re: "(?i)^forward$"
reload_button:
  control_type: Button
  title_re: "(?i)^reload$"
home_button:
  class_name: HomeButton
bookmark_star:               # StarView (<= 31) / PageActionView (155+, shared by other page actions)
  class_name_re: "^(StarView|PageActionView)$"
  title_re: "(?i)bookmark"
bookmark_star_filled:        # the page is bookmarked; clicking removes the bookmark
  class_name_re: "^(StarView|PageActionView)$"
  title_re: "(?i)^remove from bookmarks"
bookmarks_button:            # toolbar star-list button -> bookmarks panel
  class_name: BookmarksButton
app_menu_button:
  class_name: BrowserAppMenuButton
tab_search_button:
  class_name: TabsToolbarButton
side_bar:
  class_name: MobileSideBar
extensions_button:           # puzzle icon "Add-ons" -> add-ons menu (pin / more options)
  class_name: ExtensionsToolbarButton
downloads_button:
  control_type: Button
  title_re: "(?i)^downloads?$"
tab_strip:
  control_type: Tab
new_tab_button:
  class_name: NewTabButton
# Bookmarks panel (toolbar "Bookmarks" button): header buttons + folder tree
bookmarks_panel_add_page:    # adds the current page
  control_type: Button
  title: Add bookmark
bookmarks_panel_create_folder:
  auto_id: createFolderButton
bookmarks_panel_expand:      # opens the bookmark manager
  auto_id: expandButton
bookmarks_panel_folder:      # params: name
  control_type: Button
  auto_id: folder
  title: "{name}"
bookmarks_panel_item:        # a bookmark row; params: name
  control_type: TreeItem
  title: "{name}"
# Edit bubble (toast "Edit" after Ctrl+D)
bookmark_edit_name:
  control_type: Edit
  title: Bookmark name
bookmark_edit_url:
  control_type: Edit
  title: Bookmark URL
bookmark_edit_save:
  control_type: Button
  class_name: OneUITextButton
  title: Save
# Add-ons toolbar menu (puzzle "Add-ons" button) and pinned add-on icons; params: name
addons_menu_pin:
  control_type: Button
  title: "Pin {name}"
addons_menu_unpin:
  control_type: Button
  title: "Unpin {name}"
addons_menu_more:
  control_type: Button
  title: "More options for {name}"
extension_action:            # pinned add-on icon: "<name>\nHas access to this site"
  class_name: ToolbarActionView
  title_re: "^{name}"
download_bubble_item:        # row of the toolbar Downloads bubble: "<name> <size> • Done"
  class_name: DownloadBubbleTransparentButton
download_bubble_close:       # X of that bubble (build 155: it covers "Clear download history");
  control_type: Button       # native.close_download_bubble() presses Esc if it is not found
  title_re: "(?i)^close$"
bookmarks_bar:
  control_type: ToolBar
  title_re: "(?i)bookmarks"

# Dialog / bubble names (title_re of the dialog container, or of a text inside it)
dialogs:
  bookmark_added: "(?i)page bookmarked|bookmark added to"   # toast: "Page bookmarked." / "Bookmark added to <folder>" [Edit]
  add_extension: "(?i)add .*\\?"
  remove_extension: "(?i)(delete|remove) .*\\?"   # Samsung: "Delete <name>?" [Remove] [Cancel]
  file_save: "(?i)save as"
  file_open: "(?i)^open$"
  download_bubble: "(?i)downloads?"
  # not exercised by any test yet - check with uia_dump before relying on them:
  print: "(?i)^print$"
  http_auth: "(?i)sign in"
  permission_prompt: "(?i)wants to|show notifications|know your location|use your camera|use your microphone"

# Bubbles a fresh profile may show on start: closed by the first native actions after start
# (nothing waits for them, see native.startup_bubble_watch in default.yaml).
# Each entry: text (regex of a label inside the bubble) + button to press.
startup_bubbles:
  - text: "(?i)has been updated"
    button: Close

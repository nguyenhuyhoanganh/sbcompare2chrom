# Google Chrome / Chrome for Testing - upstream reference with the same Chromium base.
# Recommended: Chrome for Testing, fetched with `python -m sbtest.tools.get_chrome`
# (branded Google Chrome ignores --load-extension since v137, so add-on tests need CfT).
browser:
  exe: browsers/chrome/chrome.exe   # relative to the repo root; override in local.yaml
pages:
  scheme: chrome
native:
  ui_map: config/native_ui/chromium.yaml
page_objects: chromium

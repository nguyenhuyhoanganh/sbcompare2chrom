# Samsung Internet / Samsung Browser for Windows - the product under test.
browser:
  exe: ""                        # set in config/local.yaml: <build folder>\SamsungInternet.exe
  # chromedriver hangs when it launches Samsung Browser itself (it never connects to
  # DevTools), so we start the exe with --remote-debugging-port and attach.
  mode: attach
pages:
  # The address bar SHOWS internet://bookmarks, but WebDriver/CDP navigation only accepts
  # chrome://bookmarks (driver.get("internet://...") leaves the tab on about:blank).
  # Typing internet://... into the omnibox (native.navigate) works too.
  scheme: chrome
  display_scheme: internet
native:
  ui_map: config/native_ui/samsung.yaml
# Page object implementation used by the `pages` fixture (sbtest/pages/samsung/).
page_objects: samsung
